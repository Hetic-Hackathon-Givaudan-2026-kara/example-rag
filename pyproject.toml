[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# E/F : erreurs de base, I : ordre des imports, B : bugs fréquents, UP : syntaxe Python moderne
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Code hérité de l'exemple du professeur : il sera déplacé dans app/ (commits 3c à 3f),
# où la règle B905 s'appliquera. Supprimer ces lignes à ce moment-là.
"api.py" = ["B905"]
"ingest.py" = ["B905"]
"list.py" = ["B905"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "ollama: test qui exige un vrai Ollama en fonctionnement",
]
